name: .NET SDK Release

on:
  push:
    tags:
      - "dotnet-sdk-v*"
      - "commerce-dotnet-v*"

jobs:
  pack:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/dotnet
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore src/Commerce/Commerce.csproj

      - name: Pack
        run: dotnet pack src/Commerce/Commerce.csproj -c Release -o ./artifacts

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: commerce-dotnet-sdk
          path: sdks/dotnet/artifacts/*.nupkg
