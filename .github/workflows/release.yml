name: .NET SDK Release

on:
  push:
    tags:
      - "dotnet-sdk-v*"
      - "inttegro-dotnet-v*"

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore src/Inttegro/Inttegro.csproj

      - name: Pack
        run: dotnet pack src/Inttegro/Inttegro.csproj -c Release -o ./artifacts

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: inttegro-dotnet-sdk
          path: artifacts/*.nupkg
