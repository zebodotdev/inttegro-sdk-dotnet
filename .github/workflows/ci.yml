name: .NET SDK CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore src/Commerce/Commerce.csproj && dotnet restore tests/Commerce.Tests/Commerce.Tests.csproj

      - name: Build
        run: dotnet build tests/Commerce.Tests/Commerce.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/Commerce.Tests/Commerce.Tests.csproj --configuration Release --collect:"XPlat Code Coverage"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: "**/coverage.cobertura.xml"
          flags: dotnet
          name: dotnet-sdk
