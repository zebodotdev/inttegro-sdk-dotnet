name: .NET SDK CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      INTTEGRO_OPENAPI_SPEC: openapi/commerce.yml
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout OpenAPI contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zebodotdev/openapi
          ref: 7f9e846dc4202e2abb75733e99c69e4fd5b86fae
          path: openapi
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore src/Inttegro/Inttegro.csproj && dotnet restore tests/Inttegro.Tests/Inttegro.Tests.csproj

      - name: Build
        run: dotnet build tests/Inttegro.Tests/Inttegro.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/Inttegro.Tests/Inttegro.Tests.csproj --configuration Release --collect:"XPlat Code Coverage"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457 # v3
        with:
          files: "**/coverage.cobertura.xml"
          flags: dotnet
          name: dotnet-sdk
